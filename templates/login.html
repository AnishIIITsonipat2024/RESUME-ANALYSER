{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>AI Resume Analyzer</h1>
        <h2>Login</h2>

        <form action="/login" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

{% endblock %}
