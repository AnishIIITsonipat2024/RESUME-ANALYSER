{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Create Account</h1>

        <form action="/register" method="POST">

            <input
                type="text"
                name="fullname"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p>

            Already have an account?

            <a href="/login">Login</a>

        </p>

    </div>

</div>

{% endblock %}
